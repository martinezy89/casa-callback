<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa sign-in</title>
<style>body{margin:0;background:#071116;color:#F2F2ED;font:17px -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px}a{color:#EAB563}</style>
</head><body><main><p>Returning to Casa…</p><p><a id="back" href="#">Tap here if the app did not open</a></p></main>
<script>
// Hue and Sonos only redirect to https pages. This page hands the code straight back to the app.
var svc = location.pathname.split('/').filter(Boolean).pop() || 'hue';
var target = 'casalite://' + svc + location.search;
document.getElementById('back').href = target;
location.replace(target);
</script></body></html>
